name = "moonlight-api"
main = "worker.js"
compatibility_date = "2024-01-01"

# Secrets (set via wrangler secret put):
#   APP_TOKEN, CLAUDE_API_KEY, ASTROLOGY_API_KEY, JWT_SECRET, GOOGLE_CLIENT_ID

[vars]
APPLE_BUNDLE_ID = "com.damla.moonlight"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2927eef779f343eea0fea0bd348fde9e"

# Create with: npx wrangler d1 create moonlight_db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "moonlight_db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
